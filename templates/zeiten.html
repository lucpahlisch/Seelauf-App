   <script>

function erstelleTabelle(daten, tableId) {

    const table = document.getElementById(tableId);

    for (let klasse in daten) {

        daten[klasse].forEach(schueler => {

            if (
                schueler.name.trim() === "" &&
                schueler.zeit.trim() === ""
            ) {
                return;
            }

            table.innerHTML += `
                <tr>
                    <td>${klasse}</td>
                    <td>${schueler.name}</td>
                    <td>${schueler.zeit}</td>
                </tr>
            `;

        });

    }
}

erstelleTabelle(jg56, "jg56Table");
erstelleTabelle(jg78, "jg78Table");
erstelleTabelle(jg910, "jg910Table");
erstelleTabelle(obs, "obsTable");

</script>
