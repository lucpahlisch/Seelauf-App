<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Verwalten</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo.svg') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <div class="nav-left">
                <a class="btn" href="{{ url_for('startseite') }}">Home</a>
            </div>
            <div class="nav-right">
                 <a class="btn" href="{{ url_for('manu') }}">Manu</a>
                <a class="btn" href="{{ url_for('zeiten') }}">Zeiten</a>
                <a class="btn" href="{{ url_for('verwalten') }}">Verwalten</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="form-card">
            <h1>Schüler hinzufügen</h1>
            <form method="POST" class="form-grid">
                <input type="text" name="name" placeholder="Name" required>
                <input type="text" name="vorname" placeholder="Vorname" required>
                <select name="jahrgang">
                    <option value="JG 5/6">JG 5/6</option>
                    <option value="JG 7/8">JG 7/8</option>
                    <option value="JG 9/10">JG 9/10</option>
                    <option value="OBS">Oberstufe</option>
                </select>
                <input type="text" name="klasse" placeholder="5a" required>
                <input type="text" name="zeit" placeholder="12:45">
                <div style="flex-basis:100%;"></div>
                <button class="btn" type="submit" name="hinzufuegen">Schüler hinzufügen</button>
            </form>
        </section>

        <section class="form-card">
            <h2>Schüler löschen</h2>
            <form method="POST">
                <select name="schueler_id" required style="padding:10px;border-radius:10px;border:1px solid rgba(11,37,64,0.08);min-width:320px;">
                    {% for s in schueler %}
                        <option value="{{ s['id'] }}">
                            {{ s["jahrgang"] }} | {{ s["klasse"] }} | {{ s["vorname"] }} {{ s["name"] }} | {{ s["zeit"] }}
                        </option>
                    {% endfor %}
                </select>
                <div style="margin-top:12px;">
                    <button class="btn" type="submit" name="loeschen">Schüler löschen</button>
                </div>
            </form>
        </section>

        <section class="form-card stopwatch-card" aria-label="Stopuhr">
            <div class="stopwatch-header">
                <h2>Stopuhr</h2>
                <span id="stopwatch-status" class="stopwatch-status">Gestoppt</span>
            </div>

            <div id="stopwatch-display" class="stopwatch-display" aria-live="polite">00:00:00</div>

            <div class="stopwatch-controls">
                <button id="stopwatch-toggle" class="stopwatch-btn primary" type="button">Starten</button>
                <button id="stopwatch-reset" class="stopwatch-btn secondary" type="button">Zurücksetzen</button>
                <button id="stopwatch-split" class="stopwatch-btn tertiary" type="button">Zwischenzeit</button>
            </div>

            <div class="split-list-wrapper">
                <h3>Zwischenzeiten</h3>
                <ul id="split-list" class="split-list">
                    <li>Keine Zwischenzeit erfasst.</li>
                </ul>
            </div>
        </section>
    </main>

    <footer class="site-footer"></footer>

    <script>
        const stopwatchDisplay = document.getElementById('stopwatch-display');
        const stopwatchStatus = document.getElementById('stopwatch-status');
        const stopwatchToggle = document.getElementById('stopwatch-toggle');
        const stopwatchReset = document.getElementById('stopwatch-reset');
        const stopwatchSplit = document.getElementById('stopwatch-split');
        const splitList = document.getElementById('split-list');

        let stopwatchRunning = false;
        let stopwatchStart = 0;
        let stopwatchElapsed = 0;
        let stopwatchInterval = null;
        let splitCounter = 0;

        function formatTime(totalMilliseconds) {
            const totalSeconds = Math.floor(totalMilliseconds / 1000);
            const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function updateStopwatch() {
            stopwatchDisplay.textContent = formatTime(stopwatchElapsed);
        }

        function addSplit() {
            if (!stopwatchRunning && stopwatchElapsed === 0) {
                return;
            }

            splitCounter += 1;
            const item = document.createElement('li');
            item.textContent = `Zwischenzeit ${splitCounter}: ${formatTime(stopwatchElapsed)}`;
            const firstItem = splitList.querySelector('li');

            if (firstItem && firstItem.textContent.includes('Keine Zwischenzeit')) {
                splitList.innerHTML = '';
            }

            splitList.appendChild(item);
        }

        function startStopwatch() {
            if (stopwatchRunning) {
                clearInterval(stopwatchInterval);
                stopwatchInterval = null;
                stopwatchRunning = false;
                stopwatchToggle.textContent = 'Starten';
                stopwatchStatus.textContent = 'Gestoppt';
                return;
            }

            stopwatchRunning = true;
            stopwatchStart = Date.now() - stopwatchElapsed;
            stopwatchToggle.textContent = 'Stoppen';
            stopwatchStatus.textContent = 'Läuft';

            stopwatchInterval = setInterval(() => {
                stopwatchElapsed = Date.now() - stopwatchStart;
                updateStopwatch();
            }, 100);
        }

        function resetStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchInterval = null;
            stopwatchRunning = false;
            stopwatchElapsed = 0;
            stopwatchStart = 0;
            splitCounter = 0;
            stopwatchToggle.textContent = 'Starten';
            stopwatchStatus.textContent = 'Gestoppt';
            splitList.innerHTML = '<li>Keine Zwischenzeit erfasst.</li>';
            updateStopwatch();
        }

        stopwatchToggle.addEventListener('click', startStopwatch);
        stopwatchReset.addEventListener('click', resetStopwatch);
        stopwatchSplit.addEventListener('click', addSplit);
        updateStopwatch();
    </script>
</body>
</html>
